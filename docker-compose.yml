services:
  db:
    image: postgres:16-alpine
    container_name: lab1-db
    environment:
      POSTGRES_DB: items_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d items_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: .
      dockerfile: Dockerfile.migration
    container_name: lab1-migration
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/items_db
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab1-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/items_db
    depends_on:
      migration:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lab1-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: