name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
    paths-ignore:
      - 'docs/**'
      - 'README.md'

jobs:
  build-n-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -v

  docker-pack-n-push:
    needs: build-n-test
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      image_name: lab1-cicd
      image_tag: latest
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}